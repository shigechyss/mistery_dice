<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミステリー・ダイス（プロトタイプ）</title>
<style>
:root{--bg:#e8ebe7;--card:#f6f8f5;--ink:#1c2430;--mut:#5d6a73;--acc:#2f5d62;--ng:#a4452c;--ln:#c3ccc6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#18202b;--ink:#e3e7ea;--mut:#93a1ac;--acc:#7fc4bd;--ng:#e2876b;--ln:#2c3846;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#18202b;--ink:#e3e7ea;--mut:#93a1ac;--acc:#7fc4bd;--ng:#e2876b;--ln:#2c3846;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.5rem;margin:.2em 0;letter-spacing:.08em}
p{margin:.6em 0}.mut{color:var(--mut);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:12px 16px;margin:14px 0}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:10px 14px;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;border-left:4px solid var(--acc)}
.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.st{display:inline-block;margin:2px 10px 2px 0}.st button{padding:0 8px;margin-left:4px}
.dice{text-align:center}.d{font-size:5.5rem;line-height:1.2;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.ok{color:var(--acc);font-size:1.6rem;font-weight:700}.ng{color:var(--ng);font-size:1.6rem;font-weight:700}
.endbox{margin:24px 0;padding:18px 12px;text-align:center;border-top:3px double var(--acc);border-bottom:3px double var(--acc);cursor:default;user-select:none}
.endbox .k{font-size:.8rem;letter-spacing:.3em;color:var(--mut)}.endbox .tt{font-size:1.6rem;font-weight:700;letter-spacing:.15em;color:var(--acc);margin:.2em 0}
.endbox.bad{border-color:var(--ng)}.endbox.bad .tt{color:var(--ng)}
textarea{width:100%;box-sizing:border-box;min-height:140px;font:13px/1.5 monospace;background:var(--card);color:var(--ink);border:1px solid var(--ln);padding:8px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.sgi{display:flex;gap:4px}.sgi button:first-child{flex:1;text-align:left}
.dl{display:flex;gap:10px;align-items:flex-start;margin:.7em 0}.av{flex:none;border-radius:50%;object-fit:cover;background:var(--acc);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 6px}
summary{cursor:pointer}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}
</style>
</head>

suspects:['隆','美咲','佐伯'],

c_ink:{t:'佐伯の万年筆とインク染み',who:2,d:'机に佐伯が肌身離さず使う万年筆と、乾ききっていないインクの染み。今夜、佐伯がここで清書をしていた。',w:'机に万年筆とインクの染みがある。まだ新しいようだが、誰のものかは分からない。'},
c_foot:{t:'窓の下の足跡',who:0,d:'窓の下に大きな男物の足跡。だが窓は内側から施錠されたままだ。',w:'足跡のようなものが雨に流されかけている。'},
c_takashi_say:{t:'隆の証言',who:0,d:'「今夜はずっと部屋で寝ていた」と隆は言い切った。',w:'隆は目を逸らし、「寝ていたはずだ」と繰り返した。'},
c_key:{t:'書斎の鍵の貸し出し',who:1,d:'佐伯「今夜、美咲様に書斎の鍵をお貸ししました」',w:'佐伯「鍵は誰かがお借りになったかもしれません」と濁した。'},
c_saeki_say:{t:'佐伯の証言',who:2,d:'「今夜、私は書斎に入っておりません」と佐伯は断言した。',w:'佐伯は書斎の話を避けている。'},
c_phone:{t:'離れの痕跡',who:0,d:'離れに泥だらけの靴と、借金取りへの通話の痕跡がある。',w:'離れに誰かがいた形跡があるが、詳しくは分からない。'},

hub:{text:'朝までに犯人を突き止めなければならない。手帳で手がかりを整理し、証言と物証の食い違いを探そう。\n助手「所長、気になるところから攻めましょう！」',choices:[
K('書斎を調べる','s1','観察',10,'a_ok','a_ng'),

K('佐伯に話を聞く','s4','話術',11,'d_ok','d_ng'),

{label:'肖像画の裏を調べる',require:['portrait'],hide:'s7',next:'portrait'},

portrait:R(['s7'],['c_will2'],'執事の言葉を元に肖像画の裏を調べると、隠し棚から一通の封筒が見つかった。\n——『新しい遺言書』。隆を許し、財産を姉弟で二分するという当主の真意が記されていた。\n助手「金庫から盗まれた古い遺言書と、内容が全然違いますよ……。一体、誰が何のために？」'),
i_ok:{gain:['i1'],hunch:2,text:'屋敷の廊下を歩くうち、ふと違和感が背筋をなぞった。「女物」「鍵」「窓」……ばらばらの手がかりが、同じ方向を指している気がする。\n助手「所長、今、何か閃きました？」\n勘が冴えた。（ひらめき+2）',choices:BACK},

accuse:{text:'全員を居間に集めた。\n助手「所長、誰を指摘しますか……？」',choices:[

{label:'手がかりを突きつけて追い詰める',check:{stat:'話術',dc:14,power:1},success:'motive',fail:'end_bad'}]},

function validate(o){
 const e=[],w=[];
 if(!o||typeof o!=='object'||Array.isArray(o))return{e:['JSONの形式が正しくありません。'],w};
 if(o.format_version!==1)e.push('format_version は 1 にしてください。');
 if(!o.id||typeof o.id!=='string')e.push('id（半角英数の識別名）がありません。');
 else if([STORY,STORY2,STORY3].some(x=>x.id===o.id))e.push('その id は標準ストーリーと重複しています。');
 if(!o.title)e.push('title（タイトル）がありません。');
 if(o.difficulty!==undefined&&!(o.difficulty>=1&&o.difficulty<=10))e.push('difficulty は1〜10にしてください。');
 if(o.world&&(!o.world.name||!o.world.special))e.push('world には name（物語世界の名前）と special（異能の呼び名）が必要です。');
 const S=o.scenes;
 if(!S||!S.start){e.push('scenes.start（最初の場面）がありません。');return{e,w}}
 const gained=new Set(),to=[],ends=[];
 for(const [id,x] of Object.entries(S)){
  if(typeof x.text!=='string'){e.push(`場面「${id}」に text がありません。`);continue}
  x.text.split('\n').forEach(l=>{if(l[0]==='?'&&!/^\?\w+(>=|<)\d\|/.test(l))e.push(`場面「${id}」の条件付きの行の書式が正しくありません（?手がかりID>=2|文章）。`)});
  [...(x.gain||[]),...(x.strong||[])].forEach(f=>gained.add(f));
  if(x.ending){ends.push(id);if(!KIND[x.ending.kind])e.push(`場面「${id}」の ending.kind は true / good / bad のいずれかです。`)}
  else if(!(x.choices||[]).length)e.push(`場面「${id}」は行き止まりです（choices か ending が必要です）。`);
  for(const c of x.choices||[]){
   if(!c.label)e.push(`場面「${id}」に label のない選択肢があります。`);
   if(c.check){if(!STATS.includes(c.check.stat)||!(c.check.dc>0))e.push(`場面「${id}」の判定には stat（${STATS.join('・')}）と dc（目標値）が必要です。`);to.push([id,c.success],[id,c.fail])}else to.push([id,c.next]);
  }
 }
 to.forEach(([id,n])=>{if(!n||!S[n])e.push(`場面「${id}」の行き先「${n||'未設定'}」が存在しません。`)});
 for(const [id,x] of Object.entries(S))for(const c of x.choices||[])[...(c.require||[]),c.hide].filter(Boolean).forEach(f=>{if(!gained.has(f))e.push(`場面「${id}」の条件「${f}」を得られる場面がありません。`)});
 const cl=o.clues||{},n=(o.suspects||[]).length;
 for(const [k,x] of Object.entries(cl)){if(!gained.has(k))w.push(`手がかり「${k}」を入手できる場面がありません。`);if(n&&x.who>=n)e.push(`手がかり「${k}」の who が容疑者の人数を超えています。`)}
 for(const c of o.contradictions||[]){if(!cl[c.a]||!cl[c.b])e.push('contradictions に未定義の手がかりがあります。');if(!S[c.to])e.push(`contradictions の行き先「${c.to}」が存在しません。`)}
 const q=['start',...(o.contradictions||[]).map(c=>c.to)],seen=new Set(q);
 while(q.length){const x=S[q.pop()];if(!x)continue;for(const c of x.choices||[])for(const t of c.check?[c.success,c.fail]:[c.next])if(t&&!seen.has(t)){seen.add(t);q.push(t)}}
 Object.keys(S).filter(id=>!seen.has(id)).forEach(id=>w.push(`場面「${id}」にはどこからも行けません。`));
 if(!ends.length)e.push('エンディング（ending を持つ場面）が1つもありません。');
 else if(!ends.some(id=>seen.has(id)))e.push('エンディングに到達できません。');
 return{e,w};
}
function addStory(t){
 let o;try{o=JSON.parse(t)}catch(x){return{err:'JSONとして読めません。カンマや引用符の抜け、全角の記号などを確認してください。\n（'+x.message+'）'}}
 const r=validate(o);
 if(r.e.length)return{err:`読み込めませんでした（${r.e.length}件）：\n`+r.e.map(x=>'・'+x).join('\n')};
 custom=custom.filter(x=>x.id!==o.id).concat(o);ls('mq_stories',custom);
 return{title:o.title,warn:r.w.map(x=>'・'+x).join('\n')};
}
function go(id){
 const sc=run.s.scenes[id];run.cur=id;
 (sc.gain||[]).forEach(f=>run.flags[f]=Math.max(run.flags[f]||0,1));(sc.strong||[]).forEach(f=>run.flags[f]=2);
 if(sc.hunch&&!run.seen[id]){run.seen[id]=1;run.hunch+=sc.hunch}
 view(id);
}
function view(id){
 const s=run.s,sc=s.scenes[id];app.innerHTML='';
 const hd=E('div','mut',`${s.title}　ひらめき ${run.hunch}　追及力 ${power()}`);app.append(hd);
 if(!sc.ending){const hb=E('div','btnrow');if(s.clues){const b=E('button','','手帳');b.onclick=book;hb.append(b)}const w=E('button','','メニュー');w.onclick=menu;hb.append(w);app.append(hb)}
 const t=E('div','card');sc.text.split('\n').forEach(p=>{const m=p.match(/^\?(\w+)(>=|<)(\d)\|(.*)$/);if(m){const v=run.flags[m[1]]||0;if(m[2]==='>='?v<+m[3]:v>=+m[3])return;p=m[4]}t.append(line(p))});app.append(t);
 if(sc.ending)return ending(id,sc.ending);
 (sc.choices||[]).forEach(c=>{
  if(c.hide&&run.flags[c.hide])return;if(c.require&&!c.require.every(f=>run.flags[f]))return;
  const b=E('button','ch',c.label+(c.check?`　【${sn(c.check.stat)}判定　成功率${pct(c.check)}%】`:''));
  b.onclick=()=>c.check?roll(c):go(c.next);app.append(b)});
}

 [['判定','選択肢の【判定】では、1D20（20面ダイス）を振り、出目＋ステータスが目標値以上なら成功です。出目20は必ず成功、出目1は必ず失敗します。'],
 ['異能','物語世界に入るたび、異能がその世界の力（直感・霊力・魔力など）に変換されます。数値は共通で、育てた分だけ、どの世界でも「異能」の判定に加算されます。'],
 ['ひらめき（消費型）','判定に失敗すると+1、「助手に意見を聞く」でも+1されます。2つ貯めると、失敗した判定を「ひらめきで押し切る」で成功に変えられます（2つ消費）。持ち越しはなく、物語ごとにリセットされます。'],
 ['手がかり','調査で手に入ります。成功すると「確か」、失敗しても「あやふや」な手がかりが手に入ります。'],
 ['追及力','手がかりの確かさ（確か＝2、あやふや＝1の合計の半分、切り捨て）に、手帳で正しく関連づけた人物の数を足した値です（最大8）。最後の追い詰めの判定に加算され、そこでは推理の成長分もさらに加わります。'],
 ['主人公・世界観','探偵と助手は、物語ごとに違う世界を旅し、事件だけでなく、怪異や不可思議な現象、異世界の謎も解き明かします。2人の名前と画像は、タイトル画面の「主人公の名前・画像」から変えられます。'],
 ['手帳','手がかりを2つ選ぶと、証言と物証の食い違いを突き合わせられます。各手がかりに「関連」する人物を設定することもできます。'],
 ['成長ポイント','犯人を突き止めてクリアすると手に入ります（真相エンディングは2、通常クリアは1。エンディングごとに初回のみ）。タイトル画面でステータスに割り振れます。']].forEach(([h,t])=>{const c=E('div','card');c.append(E('strong','',h),E('p','',t));app.append(c)});
 const b=E('button','ch pri','戻る');b.onclick=back;app.append(b);
}
const HEROES=[{n:'探偵',r:'あなた（プレイヤーの分身）',d:'冷静沈着で論理的。事件も怪異も、不可思議な現象も、証言と物証の食い違いから解き明かす。'},{n:'助手',r:'探偵の相棒',d:'少しミーハーで雑学好き。軽妙なツッコミと、ふとしたヒントで探偵を支える。'}];
const HK=['探偵','助手'];
const hero=k=>{const h=(save.heroes||{})[k]||{};return{name:(h.name||'').trim()||k,img:/^data:image\/(jpeg|png|webp);base64,/.test(h.img||'')?h.img:''}};
function avatar(k,n){const h=hero(k);let a;if(h.img){a=E('img','av');a.src=h.img;a.alt=h.name}else{a=E('div','av',[...h.name][0]);a.style.fontSize=(n*.5)+'px'}a.style.width=a.style.height=n+'px';return a}
function pic(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const n=160,c=document.createElement('canvas');c.width=c.height=n;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);cb(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>cb(null);im.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}
const setHero=(k,o)=>{save.heroes=save.heroes||{};save.heroes[k]=Object.assign(save.heroes[k]||{},o);persist()};
function line(p){
 const f=x=>x.replace(/\{(探偵|助手)\}/g,(_,k)=>hero(k).name),m=p.match(/^(探偵|助手)(「[\s\S]*)$/);
 if(!m)return E('p','',f(p));
 const r=E('div','dl');r.append(avatar(m[1],34),E('span','',hero(m[1]).name+f(m[2])));return r;
}
function heroEdit(back){
 app.innerHTML='';app.append(E('h1','','主人公の設定'),E('p','mut','探偵と助手の名前・画像を変えられます。この端末のブラウザに保存され、セーブの書き出しにも含まれるので、別の端末にも移せます。'));
 const msg=E('p','mut');
 HK.forEach((k,idx)=>{
  const c=E('div','card'),row=E('div','dl'),slot=E('div'),box=E('div');box.style.flex='1';
  const draw=()=>{slot.innerHTML='';slot.append(avatar(k,64))};draw();
  const inp=E('input');inp.type='text';inp.maxLength=12;inp.value=hero(k).name;inp.setAttribute('aria-label',k+'の名前');
  inp.style.cssText='width:100%;box-sizing:border-box;font:inherit;padding:8px;margin:6px 0;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:4px';
  inp.onchange=()=>{setHero(k,{name:inp.value.trim().slice(0,12)});draw();msg.textContent='名前を保存しました。'};
  const f=E('input');f.type='file';f.accept='image/*';f.style.display='none';
  f.onchange=()=>{if(f.files[0])pic(f.files[0],d=>{if(!d){msg.textContent='画像を読み込めませんでした。';return}setHero(k,{img:d});draw();msg.textContent='画像を保存しました（正方形に切り抜いて縮小します）。'})};
  const b1=E('button','','画像を選ぶ');b1.onclick=()=>f.click();
  const b2=E('button','','画像を消す');b2.onclick=()=>{setHero(k,{img:''});draw();msg.textContent='画像を消しました。'};
  const br=E('div','btnrow');br.append(b1,b2);box.append(E('div','mut',idx?'助手':'探偵（あなた）'),inp,br,f);row.append(slot,box);c.append(row);app.append(c)});
 const b=E('button','ch pri','戻る');b.onclick=back;app.append(msg,b);
}
function cast(s,back){
 app.innerHTML='';app.append(E('h1','','登場人物'),E('div','mut','主人公コンビ'));
 HEROES.forEach(x=>{const c=E('div','card'),r=E('div','dl'),b=E('div');b.append(E('strong','',hero(x.n).name),E('span','mut','　'+x.r),E('div','',x.d));r.append(avatar(x.n,44),b);c.append(r);app.append(c)});
 const eb=E('button','','主人公の名前・画像を変更する');eb.onclick=()=>heroEdit(()=>cast(s,back));app.append(eb);
 if(s&&s.cast){app.append(E('div','mut',`『${s.title}』の登場人物`));s.cast.forEach(x=>{const c=E('div','card');c.append(E('strong','',x.n),E('span','mut','　'+x.r),E('div','',x.d));app.append(c)})}
 const b=E('button','ch pri','戻る');b.onclick=back;app.append(b);
}
function menu(){
 const s=run.s,ends=Object.entries(s.scenes).filter(([,x])=>x.ending),cl=save.cleared[s.id]||[];
 app.innerHTML='';app.append(E('h1','','メニュー'),E('div','mut',s.title));
 const c=E('div','card');c.append(E('strong','',`エンディング進捗　${cl.length}/${ends.length}`));
 ends.forEach(([id,x])=>{const d=E('div','',cl.includes(id)?`・${x.ending.title}（${KIND[x.ending.kind]}）`:'・？？？（未達成）');d.style.margin='4px 0';c.append(d)});
 app.append(c);
 const g=E('button','ch pri','物語に戻る');g.onclick=()=>view(run.cur);app.append(g);
 const row=E('div','btnrow');
 [['登場人物',()=>cast(s,menu)],['ルール',()=>rules(menu)],['主人公の名前・画像',()=>heroEdit(menu)]].forEach(([l,f])=>{const b=E('button','',l);b.onclick=f;row.append(b)});
 app.append(row);
 const t=E('button','ch','タイトルへ戻る');t.onclick=()=>{if(!t.dataset.ok){t.dataset.ok=1;t.textContent='もう一度押すと、進行中の物語を中断してタイトルへ戻ります';return}title()};app.append(t);
}
function book(){
 const s=run.s,c=s.clues,S=s.suspects||[],sel=[];
 const nm=v=>v>=0?S[v]:'未設定';
 app.innerHTML='';app.append(E('h1','','手帳'),E('p','mut','2つ選んで食い違いを突き合わせられます。「関連」に人物を設定し、正しく結びつくと追及力が上がります。'));
 Object.keys(c).filter(k=>run.flags[k]).forEach(k=>{
  const x=c[k],st=run.flags[k]>1,d=E('div','card'),cb=E('input');cb.type='checkbox';
  cb.onchange=()=>{if(cb.checked)sel.push(k);else sel.splice(sel.indexOf(k),1)};
  d.append(cb,E('strong','',` ${x.t}（${st?'確か':'あやふや'}）`),E('div','',st?x.d:(x.w||x.d)));
  if(x.who>=0){const l=E('button','','関連：'+nm(run.link[k]??-1));l.style.marginTop='6px';
   l.onclick=()=>{run.link[k]=((run.link[k]??-1)+2)%(S.length+1)-1;l.textContent='関連：'+nm(run.link[k])};d.append(l)}
  app.append(d)});
 const msg=E('p','mut');
 const m=E('button','ch pri','選んだ2つを突き合わせる');
 m.onclick=()=>{if(sel.length!==2){msg.textContent='手がかりを2つ選んでください。';return}
  const t=(s.contradictions||[]).find(z=>(z.a===sel[0]&&z.b===sel[1])||(z.a===sel[1]&&z.b===sel[0]));
  if(!t)msg.textContent='決定的な食い違いは見つからない。';else if(run.seen['_'+t.to])msg.textContent='すでに指摘済みだ。';else{run.seen['_'+t.to]=1;go(t.to)}};
 const x=E('button','ch','手帳を閉じる');x.onclick=()=>view(run.cur);app.append(m,msg,x);
}
function roll(c){
 app.innerHTML='';const box=E('div','card dice'),d=E('div','d','?');box.append(E('div','mut',`${sn(c.check.stat)}判定　目標値 ${c.check.dc}`),d);app.append(box);
 let i=0;const iv=setInterval(()=>{d.textContent=rnd();if(++i>9){clearInterval(iv);fin()}},60);
 function fin(){
  const r=rnd(),m=mod(c.check),g=ok(r,m,c.check.dc);d.textContent=r;
  box.append(E('p','',`出目 ${r} ＋ 補正 ${m} ＝ ${r+m}（目標 ${c.check.dc}）`+(r===20?'　大成功！':r===1?'　大失敗…':'')),E('div',g?'ok':'ng',g?'成功':'失敗'));
  const nx=()=>go(c.success);
  if(g){const b=E('button','ch pri','つづける');b.onclick=nx;box.append(b);return}
  run.hunch++;box.append(E('p','mut',`失敗から学び、ひらめき+1（現在 ${run.hunch}）。2つ貯まると、失敗を成功に変えられます。`));
  if(run.hunch>=2){const k=E('button','ch','ひらめきで押し切る（ひらめき2消費）');k.onclick=()=>{run.hunch-=2;nx()};box.append(k)}
  const b=E('button','ch pri','失敗を受け入れる');b.onclick=()=>go(c.fail);box.append(b)}
}
function ending(id,e){
 const s=run.s,cl=save.cleared[s.id]=save.cleared[s.id]||[];let note='';
 if(!cl.includes(id)){cl.push(id);if(e.kind!=='bad'){const g=e.kind==='true'?2:1;save.pts+=g;note=`成長ポイント +${g}（タイトル画面でステータスを上げられます）`}}
 persist();const b=E('div','endbox'+(e.kind==='bad'?' bad':''));b.append(E('div','k','― エンディング ―'),E('div','tt',e.title),E('div','k',KIND[e.kind]));b.append(E('div','mut',`エンディング達成　${cl.length}/${Object.values(s.scenes).filter(x=>x.ending).length}`));if(note)b.append(E('div','mut',note));app.append(b);
 const r=E('button','ch','もう一度この物語を遊ぶ');r.onclick=()=>begin(s);
 const h=E('button','ch pri','タイトルへ戻る');h.onclick=title;app.append(r,h);
}
save=normSave(ls('mq_save')||fresh());custom=ls('mq_stories')||[];title();
</script>
</body>
